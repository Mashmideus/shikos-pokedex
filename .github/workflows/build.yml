name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Reads the repo secret PRICE_API_KEY and exposes it to Gradle as a project
      # property, which app/build.gradle.kts bakes into BuildConfig.DEFAULT_PRICE_API_KEY.
      # Set the secret at: repo -> Settings -> Secrets and variables -> Actions -> New repository secret.
      ORG_GRADLE_PROJECT_PRICE_API_KEY: ${{ secrets.PRICE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shikos-pokedex-debug
          path: app/build/outputs/apk/debug/app-debug.apk
